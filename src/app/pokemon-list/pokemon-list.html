<div class="search-bar">
    <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        placeholder="Search by name or type...">
</div>

<div class="loading" *ngIf="isLoading">
    Loading Pokémon...
</div>

<div class="pokemon-grid" *ngIf="!isLoading">
    <div class="box" *ngFor="let pokemon of filteredPokemons | paginate: { itemsPerPage: 10, currentPage: page, totalItems: totalPokemons }">
        <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name">
        <h3>{{pokemon.name}}</h3>
        <p><b>Type:</b> {{pokemon.types[0].type.name}}</p>
        <p><b>Height:</b> {{pokemon.height}}</p>
        <p><b>Health:</b> {{pokemon.stats[0].base_stat}}</p>
        <p><b>Attack Power:</b> {{pokemon.stats[1].base_stat}}</p>
    </div>
</div>

<pagination-controls 
    *ngIf="!isLoading"
    (pageChange)="onPageChange($event)">
</pagination-controls>
